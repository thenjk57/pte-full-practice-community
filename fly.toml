app = "pte-full-practice-example"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PTE_DATA_DIR = "/data"
  PTE_REQUIRE_AUTH = "1"

[[mounts]]
  source = "data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
